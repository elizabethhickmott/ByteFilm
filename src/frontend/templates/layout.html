<!Doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <title>{% block title %} {% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='movie.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='leaderboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
</head>

<body>
    <header class="topbar">
        <p class="top-tag"><b>ByteFilm</b></p>
        <form action="{{ url_for('index') }}" method="get">
            <button type="submit" class="home-nav" id="homeNav">
                <span>⚅</span> home
            </button>
        </form>
        <form action="{{ url_for('leaderboard') }}" method="get">
            <button type="submit" class="leaderboard-nav" id="leaderboardNav">
                <span>★</span> leaderboard
            </button>
        </form>
        <form action="{{ url_for('login') }}" method="get">
            <button type="submit" class="login-nav" id="loginNav">
                <span>➤</span> login
            </button>
        </form>

    </header>
    <main>{% block main %}{% endblock %}</main>
</body>


</html>
